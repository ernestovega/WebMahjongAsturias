# Runs on every pull request to main. Branch protection requires the "check-site" job.
name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-site:
    name: check-site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check links, HTML, JS and JSON in site/
        run: node scripts/check-site.mjs
      - name: Check that es, ast and en pages match
        run: node scripts/check-i18n.mjs

  browser-tests:
    name: browser-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser tests (menu, practice table, every page)
        run: npx playwright test
      - name: Upload report if it failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
